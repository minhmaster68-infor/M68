<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardening Challenge - Game 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0A2540; --accent: #00D4B2; --bg: #F0F4F8; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #game-container { background: white; width: 95%; max-width: 500px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 600; }
        .progress-bar { height: 8px; background: #E2E8F0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }
        .question-text { font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 20px; }
        .options-grid { display: grid; gap: 10px; }
        .option-btn { padding: 12px; border: 2px solid #E2E8F0; border-radius: 10px; background: none; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .option-btn:hover { border-color: var(--accent); background: #f0fffb; }
        .option-btn.correct { background: #d1fae5; border-color: #10b981; }
        .option-btn.wrong { background: #fee2e2; border-color: #ef4444; }
        #result-screen { display: none; }
        .btn-main { background: var(--accent); color: var(--primary); border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="quiz-screen">
        <div class="stats">
            <span>Câu: <span id="current-idx">1</span>/10</span>
            <span>Điểm: <span id="score">0</span></span>
        </div>
        <div class="progress-bar"><div id="progress"></div></div>
        
        <!-- Video thu nhỏ hỗ trợ chơi game -->
        <div style="margin-bottom: 15px; border-radius: 8px; overflow: hidden; height: 150px;">
            <iframe width="100%" height="100%" src="https://youtu.be/QQFcnDF4HfU" frameborder="0"></iframe>
        </div>

        <div class="question-text" id="question-text">Loading...</div>
        <div class="options-grid" id="options"></div>
    </div>

    <div id="result-screen">
        <h2 style="color: var(--primary);">Kết thúc!</h2>
        <div style="font-size: 3rem; font-weight: 800; margin: 15px 0;" id="final-score">0</div>
        <p id="feedback">Cố gắng thêm nhé!</p>
        <button class="btn-main" onclick="location.reload()">Chơi lại</button>
        <br>
        <a href="index.html" style="display:block; margin-top:15px; color:#64748B; text-decoration:none;">Quay về trang chủ</a>
    </div>
</div>

<script>
    const data = [
        { q: "Small talk", a: "Trò chuyện xã giao" },
        { q: "Potted tree", a: "Cây trồng trong chậu" },
        { q: "Ornamental trees", a: "Cây cảnh trang trí" },
        { q: "Cultivate", a: "Trồng trọt / Canh tác" },
        { q: "Specialized fertilization", a: "Quy trình bón phân đặc biệt" },
        { q: "Foliage stripping", a: "Tuốt lá (để ra hoa)" },
        { q: "Precise engineering", a: "Kỹ thuật chính xác" },
        { q: "Enriching the soil", a: "Bổ sung dưỡng chất cho đất" },
        { q: "Timing is key", a: "Thời điểm là then chốt" },
        { q: "Fruit-bearing", a: "Cây có quả / Ra quả" }
    ];

    let current = 0;
    let score = 0;
    let shuffled = [];

    function init() {
        shuffled = data.sort(() => 0.5 - Math.random());
        showQuestion();
    }

    function showQuestion() {
        const q = shuffled[current];
        document.getElementById('question-text').innerText = `Dịch thuật ngữ: "${q.q}"`;
        document.getElementById('current-idx').innerText = current + 1;
        document.getElementById('progress').style.width = (current / 10) * 100 + "%";

        let options = [q.a];
        while(options.length < 4) {
            let rand = data[Math.floor(Math.random() * data.length)].a;
            if(!options.includes(rand)) options.push(rand);
        }
        options.sort(() => 0.5 - Math.random());

        const div = document.getElementById('options');
        div.innerHTML = "";
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => check(btn, opt, q.a);
            div.appendChild(btn);
        });
        
        // Auto voice
        const msg = new SpeechSynthesisUtterance(q.q);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
    }

    function check(btn, selected, correct) {
        const all = document.querySelectorAll('.option-btn');
        all.forEach(b => b.disabled = true);

        if(selected === correct) {
            btn.classList.add('correct');
            score += 10;
            document.getElementById('score').innerText = score;
        } else {
            btn.classList.add('wrong');
            all.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
        }

        setTimeout(() => {
            current++;
            if(current < 10) showQuestion();
            else showResult();
        }, 1200);
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score + "/100";
    }

    init();
</script>
</body>
</html>
