<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Math Boss Battle: Geometry Quest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #090d16;
      color: #f8fafc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    #ui-header {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      padding: 10px 24px;
      border-radius: 16px;
      border: 2px solid #38bdf8;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      width: 90%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { font-size: 18px; color: #38bdf8; letter-spacing: 0.5px; }
    .status-bar { font-size: 14px; color: #cbd5e1; display: flex; gap: 20px; font-weight: bold; }
    .highlight { color: #f59e0b; }
    .hp-bar-bg { width: 120px; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .hp-bar-fill { height: 100%; width: 100%; background: #ef4444; transition: width 0.3s ease; }

    #canvas-container {
      width: 100vw;
      height: 55vh;
      position: relative;
    }

    /* Interactive Challenge Card */
    .modal-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      max-width: 92%;
      height: 40vh;
      background: rgba(15, 23, 42, 0.94);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 18px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .boss-tag {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #831843;
      color: #f472b6;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid #f472b6;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .question-box {
      font-size: 16px;
      color: #f1f5f9;
      margin: 10px 0;
      line-height: 1.4;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 10px;
      border-left: 5px solid #38bdf8;
      font-weight: 500;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .btn-opt {
      background: #334155;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .btn-opt:hover {
      background: #0284c7;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .feedback {
      font-size: 13px;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
      display: none;
      text-align: center;
    }
    .fb-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .fb-error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-header">
    <h1>⚔️ GEOMETRY BOSS ARENA 3D</h1>
    <div class="status-bar">
      <div>STAGE: <span id="stage-num" class="highlight">1 / 30</span></div>
      <div>SCORE: <span id="score-val" class="highlight">0</span></div>
      <div>BOSS HP: 
        <div class="hp-bar-bg"><div id="hp-fill" class="hp-bar-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div class="modal-overlay">
    <div class="boss-tag">
      <span id="boss-title">STAGE 1: LORD MEDIAN CUBE</span>
      <span id="boss-type">GEOMETRY BOSS</span>
    </div>
    <div class="question-box" id="question-text">Loading question...</div>
    <div class="options-grid" id="options-container"></div>
    <div class="feedback" id="feedback-box"></div>
  </div>

  <script>
    // 30 Geometry Questions based directly on textbook concepts (Page 82 & related Grade 7 Geometry)
    const questionsData = [
      {
        boss: "Stage 1: Lord Median Cube 🧊",
        q: "In triangle ABC, if AM is a median to side BC, what is the relation between BM and CM?",
        opts: ["A. BM = CM", "B. BM > CM", "C. BM = 2 * CM"],
        ans: "A. BM = CM"
      },
      {
        boss: "Stage 2: Sir Angle Bisector 📐",
        q: "If ray AM is the angle bisector of angle BAC, which two angles are equal?",
        opts: ["A. Angle BAM = Angle CAM", "B. Angle ABC = Angle ACB", "C. Angle AMB = Angle AMC"],
        ans: "A. Angle BAM = Angle CAM"
      },
      {
        boss: "Stage 3: Baron Isosceles Pyramid 🔺",
        q: "If a median AM of triangle ABC is ALSO an angle bisector, what type of triangle is ABC?",
        opts: ["A. Right Triangle at B", "B. Isosceles Triangle at A", "C. Scalene Triangle"],
        ans: "B. Isosceles Triangle at A"
      },
      {
        boss: "Stage 4: Twin-Leg Skeleton 🦴",
        q: "In an isosceles triangle ABC where AB = AC, which two base angles are congruent?",
        opts: ["A. Angle B and Angle C", "B. Angle A and Angle B", "C. Angle A and Angle C"],
        ans: "A. Angle B and Angle C"
      },
      {
        boss: "Stage 5: General S-A-S Octahedron 💎",
        q: "To prove triangle BAM = triangle CEM by Side-Angle-Side (S-A-S), we need equal pairs of:",
        opts: ["A. 3 sides", "B. 2 sides and their included angle", "C. 3 angles"],
        ans: "B. 2 sides and their included angle"
      },
      {
        boss: "Stage 6: Count Supplementary Angle 🌓",
        q: "If angle BAC = 135 degrees, what is the measure of its supplementary angle KAC?",
        opts: ["A. 45 degrees", "B. 55 degrees", "C. 135 degrees"],
        ans: "A. 45 degrees"
      },
      {
        boss: "Stage 7: Duke Right-Angle Prism 📦",
        q: "In right triangle AKC (right-angled at K), if angle KAC = 45 degrees, what is angle KCA?",
        opts: ["A. 45 degrees", "B. 90 degrees", "C. 60 degrees"],
        ans: "A. 45 degrees"
      },
      {
        boss: "Stage 8: Twin-Angle Turtle 🐢",
        q: "A triangle with a 90-degree angle and two equal 45-degree angles is called a:",
        opts: ["A. Right Isosceles Triangle", "B. Equilateral Triangle", "C. Obtuse Triangle"],
        ans: "A. Right Isosceles Triangle"
      },
      {
        boss: "Stage 9: Altitude Alien 👽",
        q: "A line segment drawn from a triangle's vertex perpendicular to the opposite side is an:",
        opts: ["A. Altitude", "B. Median", "C. Midsegment"],
        ans: "A. Altitude"
      },
      {
        boss: "Stage 10: Orthocenter Octopus 🐙",
        q: "The intersection point H of the three altitudes AI, BJ, and CK of a triangle is the:",
        opts: ["A. Orthocenter", "B. Centroid", "C. Circumcenter"],
        ans: "A. Orthocenter"
      },
      {
        boss: "Stage 11: Obtuse Overlord 👹",
        q: "If angle BAC = 135 degrees (obtuse angle), where does the orthocenter H lie relative to triangle ABC?",
        opts: ["A. Outside the triangle", "B. Inside the triangle", "C. Exactly on side BC"],
        ans: "A. Outside the triangle"
      },
      {
        boss: "Stage 12: Commander Hypotenuse 🛡️",
        q: "In a right triangle, the side opposite to the 90-degree right angle is called the:",
        opts: ["A. Hypotenuse", "B. Adjacent leg", "C. Altitude"],
        ans: "A. Hypotenuse"
      },
      {
        boss: "Stage 13: Congruence Wizard 🧙‍♂️",
        q: "If triangle HAK is congruent to triangle BCK, which side is equal in length to AH?",
        opts: ["A. Side BC", "B. Side CK", "C. Side HK"],
        ans: "A. Side BC"
      },
      {
        boss: "Stage 14: Sum 180 Spectre 👻",
        q: "What is the total sum of all interior angles inside any geometric triangle?",
        opts: ["A. 180 degrees", "B. 360 degrees", "C. 90 degrees"],
        ans: "A. 180 degrees"
      },
      {
        boss: "Stage 15: Perpendicular Poodle 🐩",
        q: "If segment AI is perpendicular to segment BC (AI ⊥ BC), the angle between them is:",
        opts: ["A. 90 degrees", "B. 180 degrees", "C. 45 degrees"],
        ans: "A. 90 degrees"
      },
      {
        boss: "Stage 16: Equilateral Emperor 👑",
        q: "An isosceles triangle with one angle measuring 60 degrees becomes a(n):",
        opts: ["A. Equilateral Triangle", "B. Right Triangle", "C. Obtuse Triangle"],
        ans: "A. Equilateral Triangle"
      },
      {
        boss: "Stage 17: Midpoint Mummy 🧟",
        q: "If M is the midpoint of segment BC and BC = 14 cm, what is the length of BM?",
        opts: ["A. 7 cm", "B. 14 cm", "C. 28 cm"],
        ans: "A. 7 cm"
      },
      {
        boss: "Stage 18: Perpendicular Bisector Phantom 🌫️",
        q: "A line passing through the midpoint of a segment and perpendicular to it is a:",
        opts: ["A. Perpendicular Bisector", "B. Median", "C. Altitude"],
        ans: "A. Perpendicular Bisector"
      },
      {
        boss: "Stage 19: Tri-Median Cyclops 👁️",
        q: "How many medians can be drawn in total inside a single triangle?",
        opts: ["A. 3 medians", "B. 1 median", "C. 6 medians"],
        ans: "A. 3 medians"
      },
      {
        boss: "Stage 20: A-S-A Archmage 🔮",
        q: "What does the triangle congruence abbreviation 'A-S-A' stand for?",
        opts: ["A. Angle-Side-Angle", "B. Altitude-Segment-Angle", "C. Area-Side-Angle"],
        ans: "A. Angle-Side-Angle"
      },
      {
        boss: "Stage 21: Acute Beetle 🐞",
        q: "An angle with a measure strictly less than 90 degrees is classified as an:",
        opts: ["A. Acute Angle", "B. Obtuse Angle", "C. Straight Angle"],
        ans: "A. Acute Angle"
      },
      {
        boss: "Stage 22: Obtuse Ogre 👺",
        q: "An angle measuring between 90 degrees and 180 degrees is classified as an:",
        opts: ["A. Obtuse Angle", "B. Reflex Angle", "C. Acute Angle"],
        ans: "A. Obtuse Angle"
      },
      {
        boss: "Stage 23: Vertex Vulture 🦅",
        q: "In isosceles triangle ABC with AB = AC, what is angle A called?",
        opts: ["A. Vertex Angle", "B. Base Angle", "C. Exterior Angle"],
        ans: "A. Vertex Angle"
      },
      {
        boss: "Stage 24: Base Angle Banshee 🧜‍♀️",
        q: "If the vertex angle of an isosceles triangle is 100 degrees, how much is each base angle?",
        opts: ["A. 40 degrees", "B. 80 degrees", "C. 50 degrees"],
        ans: "A. 40 degrees"
      },
      {
        boss: "Stage 25: Exterior Kraken 🦑",
        q: "An exterior angle of a triangle is equal to the sum of two:",
        opts: ["A. Remote interior angles", "B. Adjacent angles", "C. Right angles"],
        ans: "A. Remote interior angles"
      },
      {
        boss: "Stage 26: Triangle Inequality Troll 🧌",
        q: "Can a triangle have side lengths of 2 cm, 3 cm, and 6 cm?",
        opts: ["A. No, because 2 + 3 < 6", "B. Yes, always", "C. Only if it is a right triangle"],
        ans: "A. No, because 2 + 3 < 6"
      },
      {
        boss: "Stage 27: Complementary Cobra 🐍",
        q: "Two acute angles in a right-angled triangle are always:",
        opts: ["A. Complementary (sum to 90°)", "B. Supplementary (sum to 180°)", "C. Equal to 60°"],
        ans: "A. Complementary (sum to 90°)"
      },
      {
        boss: "Stage 28: Third Angle Wizard 🧙",
        q: "In triangle ABC, if angle A = 50° and angle B = 60°, what is angle C?",
        opts: ["A. 70 degrees", "B. 80 degrees", "C. 90 degrees"],
        ans: "A. 70 degrees"
      },
      {
        boss: "Stage 29: Pythagoras Golem 🗿",
        q: "In a right isosceles triangle with leg lengths 1 and 1, the hypotenuse length is:",
        opts: ["A. Square root of 2", "B. 2", "C. Square root of 3"],
        ans: "A. Square root of 2"
      },
      {
        boss: "Stage 30: SUPREME GEOMETRY OVERLORD 🌌",
        q: "FINAL BOSS: In triangle ABC, if median AM is ALSO an altitude AM, triangle ABC is:",
        opts: ["A. Isosceles at A", "B. Scalene", "C. Right angled at B"],
        ans: "A. Isosceles at A"
      }
    ];

    let currentStage = 0;
    let score = 0;
    let bossHp = 100;

    // --- THREE.JS 3D ENGINE & HUMOROUS MATH BOSSES ---
    let scene, camera, renderer, bossGroup, mathPropsGroup;

    function init3DEngine() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090d16);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight * 0.55), 0.1, 1000);
      camera.position.set(0, 1.5, 7);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight * 0.55);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
      dirLight.position.set(5, 8, 5);
      scene.add(dirLight);

      const redLight = new THREE.PointLight(0xec4899, 1.5, 12);
      redLight.position.set(-4, 2, 2);
      scene.add(redLight);

      // Math Grid Stage Platform
      const gridHelper = new THREE.GridHelper(10, 20, 0x38bdf8, 0x1e293b);
      gridHelper.position.y = -1.5;
      scene.add(gridHelper);

      // Create Initial Math Boss
      build3DMathBoss(currentStage);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // Procedural Math Boss Builder (5 Geometric Boss Types with funny faces & math accessories)
    function build3DMathBoss(stageIdx) {
      if (bossGroup) scene.remove(bossGroup);

      bossGroup = new THREE.Group();
      mathPropsGroup = new THREE.Group();

      const bossColors = [0x38bdf8, 0xf472b6, 0xfacc15, 0x4ade80, 0xa78bfa, 0xf97316];
      const mainColor = bossColors[stageIdx % bossColors.length];

      let bodyGeo;
      const type = stageIdx % 5;

      if (type === 0) bodyGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6); // Cube Boss
      else if (type === 1) bodyGeo = new THREE.ConeGeometry(1.2, 2, 4); // Pyramid Boss
      else if (type === 2) bodyGeo = new THREE.OctahedronGeometry(1.3); // Octahedron Boss
      else if (type === 3) bodyGeo = new THREE.CylinderGeometry(0.8, 0.8, 1.8, 16); // Prism Boss
      else bodyGeo = new THREE.DodecahedronGeometry(1.2); // Polyhedron Boss

      const bodyMat = new THREE.MeshStandardMaterial({ 
        color: mainColor, 
        roughness: 0.3,
        metalness: 0.2,
        wireframe: false
      });
      const mainBody = new THREE.Mesh(bodyGeo, bodyMat);
      bossGroup.add(mainBody);

      // Wireframe overlay for mathematical look
      const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
      const wireMesh = new THREE.Mesh(bodyGeo, wireMat);
      wireMesh.scale.set(1.02, 1.02, 1.02);
      bossGroup.add(wireMesh);

      // Googly Funny Boss Eyes
      const eyeGeo = new THREE.SphereGeometry(0.2, 16, 16);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const pupilGeo = new THREE.SphereGeometry(0.08, 12, 12);
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

      // Left Eye
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.35, 0.3, 1.0);
      const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
      leftPupil.position.set(-0.35, 0.3, 1.18);

      // Right Eye (Humorous bigger eye)
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.scale.set(1.3, 1.3, 1.3);
      rightEye.position.set(0.35, 0.3, 1.0);
      const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
      rightPupil.position.set(0.35, 0.3, 1.22);

      bossGroup.add(leftEye, leftPupil, rightEye, rightPupil);

      // Math Accessories: Floating Plus, Minus, Angle symbols around boss
      const torusGeo = new THREE.TorusGeometry(0.3, 0.05, 8, 24);
      const torusMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
      const floatingRing = new THREE.Mesh(torusGeo, torusMat);
      floatingRing.position.set(1.8, 1.0, 0);
      mathPropsGroup.add(floatingRing);

      const coneHatGeo = new THREE.ConeGeometry(0.4, 0.8, 16);
      const hatMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
      const hat = new THREE.Mesh(coneHatGeo, hatMat);
      hat.position.set(0, 1.2, 0);
      hat.rotation.z = -0.2;
      bossGroup.add(hat);

      bossGroup.add(mathPropsGroup);
      bossGroup.position.y = 0.2;
      scene.add(bossGroup);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (bossGroup) {
        // Floating and rotation animation
        bossGroup.position.y = 0.2 + Math.sin(Date.now() * 0.003) * 0.18;
        bossGroup.rotation.y += 0.01;
        if (mathPropsGroup) mathPropsGroup.rotation.x += 0.02;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / (window.innerHeight * 0.55);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight * 0.55);
    }

    // --- GAME LOGIC ---
    function loadStage(stageIdx) {
      const data = questionsData[stageIdx];
      document.getElementById('boss-title').innerText = data.boss;
      document.getElementById('question-text').innerText = data.q;

      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      document.getElementById('feedback-box').style.display = 'none';

      data.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, data.ans);
        optsContainer.appendChild(btn);
      });

      build3DMathBoss(stageIdx);
      bossHp = 100;
      updateUI();
    }

    function checkAnswer(selected, correct) {
      const fb = document.getElementById('feedback-box');
      fb.style.display = 'block';

      if (selected === correct) {
        score += 100;
        bossHp = 0;
        fb.className = 'feedback fb-success';
        fb.innerText = "🎯 CRITICAL MATH HIT! Boss Defeated!";

        // Shake Animation on Hit
        bossGroup.position.x = 0.4;
        setTimeout(() => bossGroup.position.x = -0.4, 80);
        setTimeout(() => bossGroup.position.x = 0, 160);

        setTimeout(() => {
          if (currentStage < questionsData.length - 1) {
            currentStage++;
            loadStage(currentStage);
          } else {
            alert(`🎉 CONGRATULATIONS! You defeated all 30 Math Bosses and Mastered Triangle Geometry! Final Score: ${score}`);
          }
        }, 1000);

      } else {
        fb.className = 'feedback fb-error';
        fb.innerText = "❌ Incorrect calculation! Review the geometry rule and try again.";
      }
      updateUI();
    }

    function updateUI() {
      document.getElementById('stage-num').innerText = `${currentStage + 1} / 30`;
      document.getElementById('score-val').innerText = score;
      document.getElementById('hp-fill').style.width = `${bossHp}%`;
    }

    window.onload = () => {
      init3DEngine();
      loadStage(0);
    };
  </script>
</body>
</html>
