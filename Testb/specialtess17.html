<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>European Union & English Mastery Expedition</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0284c7;
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-main: #f8fafc;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      min-height: 100vh;
    }

    header { text-align: center; margin-bottom: 15px; }
    h1 { color: #38bdf8; font-size: 24px; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-top: 4px; }

    .game-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 15px; }
    
    .stats-bar {
      background: var(--panel-bg);
      border: 2px solid var(--secondary);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      background: #0284c7;
      border: 4px solid var(--primary);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #map-canvas { width: 100%; height: 520px; display: block; cursor: pointer; }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--panel-bg);
      width: 650px;
      max-width: 92%;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .badge {
      display: inline-block; padding: 4px 10px; font-size: 11px;
      font-weight: bold; border-radius: 6px; color: white; margin-bottom: 10px;
    }
    .badge-mcq { background: #8b5cf6; }
    .badge-speech { background: #d97706; }
    .badge-essay { background: #059669; }

    .question-text {
      font-size: 15px; color: #e2e8f0; margin-bottom: 18px;
      line-height: 1.5; background: #0f172a; padding: 12px;
      border-left: 4px solid var(--secondary); border-radius: 4px;
    }

    .options-grid { display: flex; flex-direction: column; gap: 10px; }

    .btn-opt {
      background: #334155; border: 1px solid #475569; color: #f8fafc;
      padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500;
      text-align: left; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-opt:hover { background: #475569; border-color: var(--secondary); }

    .interactive-area {
      display: flex; flex-direction: column; gap: 12px; margin-top: 10px;
    }

    textarea {
      width: 100%; height: 110px; background: #0f172a; color: #f8fafc;
      border: 1px solid #475569; border-radius: 8px; padding: 10px; font-family: inherit;
    }

    .btn-action {
      background: var(--secondary); color: white; border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn-action:hover { background: #0369a1; }

    .btn-close {
      background: #475569; color: #94a3b8; border: none; padding: 8px 12px;
      border-radius: 6px; font-size: 12px; cursor: pointer; float: right; margin-top: 15px;
    }

    .feedback-box {
      margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 13px; display: none;
    }
    .feedback-success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: #34d399; }
    .feedback-error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #f87171; }
  </style>
</head>
<body>

  <header>
    <h1>🇪🇺 European Union & English Mastery Expedition</h1>
    <div class="subtitle">30 High-Difficulty Challenges: Geography, EU Knowledge, Grammar, Speech & Essay Writing</div>
  </header>

  <div class="game-container">
    <div class="stats-bar">
      <div>📍 Current Stage: <span id="loc-name">1. Lisbon (Portugal)</span></div>
      <div>⭐ Progress: <span id="progress-count">0</span> / 30 Waypoints</div>
      <div>🪙 Score: <span id="score-val">0</span> pts</div>
    </div>

    <div class="map-wrapper">
      <canvas id="map-canvas" width="960" height="520"></canvas>
    </div>
  </div>

  <!-- Challenge Modal -->
  <div id="quiz-modal" class="modal-overlay">
    <div class="modal-card">
      <span id="quiz-badge" class="badge badge-mcq">Grammar & Geography</span>
      <h3 id="quiz-title" style="margin-bottom: 10px;">Waypoint Challenge</h3>
      <div id="quiz-question" class="question-text"></div>
      <div id="quiz-body"></div>
      <div id="feedback" class="feedback-box"></div>
      <button class="btn-close" onclick="closeModal()">Dismiss</button>
    </div>
  </div>

  <script>
    // 30 Waypoints spanning European Geography, EU Knowledge, Advanced Grammar, Pronunciation & Essay Writing
    const waypoints = [
      { id: 1, name: "Lisbon, Portugal", x: 80, y: 440, type: "mcq" },
      { id: 2, name: "Madrid, Spain", x: 160, y: 410, type: "mcq" },
      { id: 3, name: "Pyrenees Mountains", x: 230, y: 380, type: "speech" },
      { id: 4, name: "Paris, France", x: 260, y: 280, type: "mcq" },
      { id: 5, name: "Brussels, Belgium (EU HQ)", x: 300, y: 240, type: "essay" },
      { id: 6, name: "Amsterdam, Netherlands", x: 310, y: 200, type: "mcq" },
      { id: 7, name: "Luxembourg City", x: 330, y: 250, type: "mcq" },
      { id: 8, name: "Frankfurt, Germany (ECB)", x: 370, y: 240, type: "mcq" },
      { id: 9, name: "Berlin, Germany", x: 420, y: 200, type: "speech" },
      { id: 10, name: "Copenhagen, Denmark", x: 410, y: 140, type: "mcq" },
      { id: 11, name: "Oslo, Norway", x: 410, y: 80, type: "mcq" },
      { id: 12, name: "Stockholm, Sweden", x: 470, y: 80, type: "mcq" },
      { id: 13, name: "Helsinki, Finland", x: 550, y: 70, type: "essay" },
      { id: 14, name: "Tallinn, Estonia", x: 560, y: 110, type: "mcq" },
      { id: 15, name: "Riga, Latvia", x: 560, y: 140, type: "speech" },
      { id: 16, name: "Vilnius, Lithuania", x: 560, y: 170, type: "mcq" },
      { id: 17, name: "Warsaw, Poland", x: 500, y: 210, type: "mcq" },
      { id: 18, name: "Prague, Czechia", x: 440, y: 250, type: "mcq" },
      { id: 19, name: "Vienna, Austria", x: 470, y: 280, type: "speech" },
      { id: 20, name: "Bratislava, Slovakia", x: 500, y: 270, type: "mcq" },
      { id: 21, name: "Budapest, Hungary", x: 520, y: 290, type: "essay" },
      { id: 22, name: "Ljubljana, Slovenia", x: 450, y: 320, type: "mcq" },
      { id: 23, name: "Rome, Italy", x: 420, y: 400, type: "speech" },
      { id: 24, name: "Valletta, Malta", x: 440, y: 490, type: "mcq" },
      { id: 25, name: "Athens, Greece", x: 580, y: 440, type: "mcq" },
      { id: 26, name: "Sofia, Bulgaria", x: 590, y: 360, type: "speech" },
      { id: 27, name: "Bucharest, Romania", x: 620, y: 320, type: "mcq" },
      { id: 28, name: "Dublin, Ireland", x: 180, y: 200, type: "essay" },
      { id: 29, name: "English Channel", x: 220, y: 240, type: "mcq" },
      { id: 30, name: "Strasbourg, France (EU Parliament)", x: 340, y: 280, type: "speech" }
    ];

    const questions = [
      { q: "Portugal joined the European Communities in 1986. Her skirt fits perfectly, _______ her shirt is too tight. (Choose correct conjunction)", opts: ["A. and", "B. or", "C. but"], ans: "C. but" },
      { q: "Which mountain range separates Spain from France?", opts: ["A. The Alps", "B. The Pyrenees", "C. The Carpathians"], ans: "B. The Pyrenees" },
      { q: "Pronounce this European phrase clearly into your microphone:", phrase: "The European Union fosters economic integration and regional stability." },
      { q: "______ Mr. Dawson arrives home, he will call his son regarding the EU summit in Paris.", opts: ["A. Once", "B. Though", "C. For"], ans: "A. Once" },
      { q: "Write a short paragraph (20+ words) explaining why Brussels is regarded as the de facto capital of the European Union.", prompt: "Brussels hosts key EU institutions..." },
      { q: "He can work from home in Amsterdam, _______ he can go to the office.", opts: ["A. since", "B. or", "C. as"], ans: "B. or" },
      { q: "Luxembourg is one of the founding members of the EU. I only passed my subjects _______ you helped me.", opts: ["A. because", "B. but", "C. yet"], ans: "A. because" },
      { q: "Where is the headquarters of the European Central Bank (ECB) located?", opts: ["A. Paris", "B. Frankfurt", "C. Geneva"], ans: "B. Frankfurt" },
      { q: "Read the sentence aloud:", phrase: "Freedom of movement is a fundamental principle of the single market." },
      { q: "They were thirteen _______ at the most fourteen years old when Denmark joined the European Communities.", opts: ["A. until", "B. while", "C. or"], ans: "C. or" },
      { q: "Norway is NOT a member of the European Union. _______ I studied a lot, I still got a low grade.", opts: ["A. Even though", "B. For", "C. When"], ans: "A. Even though" },
      { q: "Everyone likes her _______ she is helpful and funny.", opts: ["A. but", "B. because", "C. yet"], ans: "B. because" },
      { q: "Write a short text (20+ words) explaining how digital innovation transformed Finland's economy.", prompt: "Finland's technological advancement..." },
      { q: "_______ you work hard in Tallinn, you will have a chance to succeed.", opts: ["A. Although", "B. Unless", "C. If"], ans: "C. If" },
      { q: "Read this sentence aloud:", phrase: "Latvia adopted the Euro as its official currency in twenty fourteen." },
      { q: "Jack was still discussing the Baltic trade deal _______ I got there.", opts: ["A. when", "B. unless", "C. so"], ans: "A. when" },
      { q: "I won't see him in Warsaw _______ his anger has cooled down.", opts: ["A. while", "B. whenever", "C. until"], ans: "C. until" },
      { q: "Three men guarded him _______ he went out into the streets of Prague.", opts: ["A. after", "B. before", "C. whenever"], ans: "B. before" },
      { q: "Read this sentence aloud:", phrase: "Austria serves as a vital diplomatic bridge between Eastern and Western Europe." },
      { q: "He's got talent, _______ he doesn't work hard enough in Bratislava.", opts: ["A. but", "B. and", "C. or"], ans: "A. but" },
      { q: "Write a brief short essay (20+ words) about the historical significance of the Danube River flowing through Budapest.", prompt: "The Danube River is central to..." },
      { q: "He used Google Maps in Ljubljana, _______ he got lost anyway.", opts: ["A. so", "B. but", "C. or"], ans: "B. but" },
      { q: "Read this sentence aloud:", phrase: "The Treaty of Rome laid the foundational framework for modern European unity." },
      { q: "I would never hit anyone, _______ they deserved it.", opts: ["A. even if", "B. for", "C. because"], ans: "A. even if" },
      { q: "You'll hurt her feelings _______ you forget her birthday in Athens.", opts: ["A. so", "B. though", "C. if"], ans: "C. if" },
      { q: "Read this sentence aloud:", phrase: "Bulgaria joined the European Union during the expansion phase in twenty zero seven." },
      { q: "Would you rather go to the cinema _______ stay at home in Bucharest?", opts: ["A. or", "B. and", "C. so"], ans: "A. or" },
      { q: "Write a short response (20+ words) evaluating the impact of Brexit after the UK departed the EU in 2020.", prompt: "The departure of the United Kingdom created..." },
      { q: "I carry a notebook _______ I can jot down any ideas while crossing the English Channel.", opts: ["A. so that", "B. while", "C. even though"], ans: "A. so that" },
      { q: "Read this sentence aloud:", phrase: "The European Parliament holds plenary sessions in Strasbourg to pass legislation." }
    ];

    let currentWaypoint = 0;
    let score = 0;
    const completedWaypoints = new Array(30).fill(false);

    // Animation & Character State
    let charPos = { x: waypoints[0].x, y: waypoints[0].y };
    let targetPos = { x: waypoints[0].x, y: waypoints[0].y };
    let isMoving = false;

    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ocean Background
      ctx.fillStyle = "#0284c7";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid Lines
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // European Continent Schematic Landmass
      ctx.fillStyle = "#1e293b";
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(50, 460); ctx.lineTo(200, 420); ctx.lineTo(250, 360);
      ctx.lineTo(280, 240); ctx.lineTo(380, 100); ctx.lineTo(580, 40);
      ctx.lineTo(650, 100); ctx.lineTo(700, 300); ctx.lineTo(600, 480);
      ctx.lineTo(400, 460); ctx.lineTo(380, 420); ctx.lineTo(150, 480);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Connecting Path Lines
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      for (let i = 0; i < waypoints.length - 1; i++) {
        ctx.beginPath();
        ctx.moveTo(waypoints[i].x, waypoints[i].y);
        ctx.lineTo(waypoints[i+1].x, waypoints[i+1].y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Waypoint Nodes
      waypoints.forEach((wp, idx) => {
        const isCurrent = idx === currentWaypoint;
        const isDone = completedWaypoints[idx];

        ctx.beginPath();
        ctx.arc(wp.x, wp.y, isCurrent ? 13 : 9, 0, Math.PI * 2);

        if (isDone) {
          ctx.fillStyle = "#10b981"; ctx.strokeStyle = "#059669";
        } else if (isCurrent) {
          ctx.fillStyle = "#f59e0b"; ctx.strokeStyle = "#d97706";
        } else {
          ctx.fillStyle = "#475569"; ctx.strokeStyle = "#334155";
        }

        ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 9px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(idx + 1, wp.x, wp.y);
      });

      // Character Token Engine Drawing (Boy Traveler)
      ctx.save();
      ctx.translate(charPos.x, charPos.y);
      
      // Head
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(0, -18, 7, 0, Math.PI * 2); ctx.fill();
      // Body
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(-5, -11, 10, 12);
      // Backpack
      ctx.fillStyle = "#78350f";
      ctx.fillRect(-8, -10, 4, 8);
      // Legs
      ctx.fillStyle = "#1e3a8a";
      ctx.fillRect(-4, 1, 3, 7); ctx.fillRect(1, 1, 3, 7);

      ctx.restore();

      // Smooth Character Interpolation
      if (isMoving) {
        const dx = targetPos.x - charPos.x;
        const dy = targetPos.y - charPos.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 2) {
          charPos.x += dx * 0.1;
          charPos.y += dy * 0.1;
        } else {
          charPos.x = targetPos.x;
          charPos.y = targetPos.y;
          isMoving = false;
        }
      }

      requestAnimationFrame(drawMap);
    }

    canvas.addEventListener('click', function(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      waypoints.forEach((wp, idx) => {
        const dist = Math.hypot(clickX - wp.x, clickY - wp.y);
        if (dist <= 18) {
          if (idx === currentWaypoint) {
            openQuizModal(idx);
          } else if (completedWaypoints[idx]) {
            showFeedback(`Waypoint ${idx + 1}: ${wp.name} is already completed!`, true);
          } else {
            alert(`Waypoint ${idx + 1} locked! Complete Waypoint ${currentWaypoint + 1} first.`);
          }
        }
      });
    });

    function openQuizModal(idx) {
      const q = questions[idx];
      const wp = waypoints[idx];
      const modal = document.getElementById('quiz-modal');
      const badge = document.getElementById('quiz-badge');
      const title = document.getElementById('quiz-title');
      const question = document.getElementById('quiz-question');
      const body = document.getElementById('quiz-body');
      const feedback = document.getElementById('feedback');

      feedback.style.display = 'none';
      title.innerText = `Stage ${idx + 1}: ${wp.name}`;
      body.innerHTML = '';

      if (wp.type === 'mcq') {
        badge.className = 'badge badge-mcq';
        badge.innerText = 'Geography & Grammar';
        question.innerText = q.q;

        const grid = document.createElement('div');
        grid.className = 'options-grid';
        q.opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'btn-opt';
          btn.innerText = opt;
          btn.onclick = () => checkMCQ(opt, q.ans);
          grid.appendChild(btn);
        });
        body.appendChild(grid);
      } else if (wp.type === 'speech') {
        badge.className = 'badge badge-speech';
        badge.innerText = 'Pronunciation Evaluator';
        question.innerHTML = `<strong>Read aloud:</strong><br>"${q.phrase}"`;

        const container = document.createElement('div');
        container.className = 'interactive-area';
        container.innerHTML = `
          <button class="btn-action" onclick="startSpeechRecognition('${q.phrase.replace(/'/g, "\\'")}')">🎙️ Record Speech</button>
          <div id="speech-result" style="font-size: 13px; color: #94a3b8; margin-top: 5px;">Click to speak into microphone...</div>
        `;
        body.appendChild(container);
      } else if (wp.type === 'essay') {
        badge.className = 'badge badge-essay';
        badge.innerText = 'AI Short Essay Assessor';
        question.innerText = q.q;

        const container = document.createElement('div');
        container.className = 'interactive-area';
        container.innerHTML = `
          <textarea id="essay-input" placeholder="${q.prompt}"></textarea>
          <button class="btn-action" onclick="evaluateEssay()">Submit Essay for AI Evaluation</button>
        `;
        body.appendChild(container);
      }

      modal.style.display = 'flex';
    }

    function checkMCQ(userAns, correctAns) {
      if (userAns === correctAns) {
        passChallenge(50, "Correct answer!");
      } else {
        displayModalFeedback("Incorrect option. Review your English grammar or geographical facts and try again!", false);
      }
    }

    function startSpeechRecognition(targetText) {
      const resDiv = document.getElementById('speech-result');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        resDiv.innerText = "Web Speech API not supported in this browser. Auto-passing for demo.";
        setTimeout(() => passChallenge(50, "Speech validated (fallback mode)."), 1500);
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      resDiv.innerText = "Listening... Speak clearly now.";

      recognition.start();

      recognition.onresult = function(event) {
        const spokenText = event.results[0][0].transcript;
        resDiv.innerText = `You said: "${spokenText}"`;

        // Calculate basic word overlap similarity score
        const targetWords = targetText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").split(/\s+/);
        const spokenWords = spokenText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").split(/\s+/);
        
        let matches = 0;
        targetWords.forEach(w => { if (spokenWords.includes(w)) matches++; });
        const accuracy = (matches / targetWords.length) * 100;

        if (accuracy >= 50) {
          setTimeout(() => passChallenge(50, `Excellent Pronunciation! Accuracy: ${Math.round(accuracy)}%`), 1000);
        } else {
          displayModalFeedback(`Pronunciation accuracy too low (${Math.round(accuracy)}%). Please try reading clearly again!`, false);
        }
      };

      recognition.onerror = function() {
        resDiv.innerText = "Microphone error or access denied. Click button to retry.";
      };
    }

    function evaluateEssay() {
      const text = document.getElementById('essay-input').value.trim();
      const words = text.split(/\s+/).filter(w => w.length > 0);

      if (words.length < 15) {
        displayModalFeedback("Essay is too short! Please write at least 15-20 complete English words.", false);
        return;
      }

      // Lightweight AI Logic heuristics (checks structure, length, vocabulary variety)
      const uniqueWords = new Set(words.map(w => w.toLowerCase()));
      const lexicalDiversity = uniqueWords.size / words.length;

      if (lexicalDiversity > 0.5) {
        passChallenge(70, `AI Evaluation Passed! Word Count: ${words.length}, Diversity Ratio: ${(lexicalDiversity * 100).toFixed(0)}%`);
      } else {
        displayModalFeedback("AI Score Low: Excessive word repetition detected. Expand your vocabulary and sentence structure.", false);
      }
    }

    function passChallenge(points, msg) {
      completedWaypoints[currentWaypoint] = true;
      score += points;
      displayModalFeedback(`✨ Stage Passed! +${points} Points. ${msg}`, true);

      setTimeout(() => {
        closeModal();
        if (currentWaypoint < waypoints.length - 1) {
          currentWaypoint++;
          targetPos = { x: waypoints[currentWaypoint].x, y: waypoints[currentWaypoint].y };
          isMoving = true;
        } else {
          alert(`🎉 CONGRATULATIONS! You have completed the entire 30-Stage European Quest! Final Score: ${score}`);
        }
        updateUI();
      }, 1200);
    }

    function displayModalFeedback(msg, isSuccess) {
      const fb = document.getElementById('feedback');
      fb.innerText = msg;
      fb.className = `feedback-box ${isSuccess ? 'feedback-success' : 'feedback-error'}`;
      fb.style.display = 'block';
    }

    function closeModal() { document.getElementById('quiz-modal').style.display = 'none'; }

    function updateUI() {
      document.getElementById('loc-name').innerText = `${currentWaypoint + 1}. ${waypoints[currentWaypoint].name}`;
      document.getElementById('progress-count').innerText = completedWaypoints.filter(Boolean).length;
      document.getElementById('score-val').innerText = score;
    }

    window.onload = function() {
      updateUI();
      drawMap();
    };
  </script>
</body>
</html>
