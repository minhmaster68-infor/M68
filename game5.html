<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Roleplay Challenge - Lesson 5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0A2540; --thu: #10b981; --jonathan: #e74c3c; --bg: #f0f4f8; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        #game-container { width: 100%; max-width: 700px; background: white; height: 100vh; display: flex; flex-direction: column; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; }
        .bubble { margin-bottom: 20px; max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; }
        .jonathan { align-self: flex-start; background: #fee2e2; border-left: 5px solid var(--jonathan); }
        .thu { align-self: flex-end; background: var(--thu); color: white; border-bottom-right-radius: 2px; }
        .label { font-size: 0.7rem; font-weight: bold; margin-bottom: 4px; display: block; text-transform: uppercase; }
        .controls { padding: 20px; border-top: 1px solid #eee; background: white; text-align: center; }
        .btn { padding: 12px 25px; border-radius: 30px; border: none; cursor: pointer; font-weight: 600; margin: 5px; transition: 0.3s; }
        .btn-mic { background: var(--jonathan); color: white; width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; }
        .btn-mic.listening { background: #2ecc71; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .feedback { font-size: 0.85rem; margin-top: 10px; padding: 10px; border-radius: 8px; display: none; }
        .hint-box { font-style: italic; color: #666; font-size: 0.8rem; margin-top: 5px; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <h3 style="margin:0;">Meeting Roleplay: Thu vs Mr. Jonathan</h3>
        <small>Luyện nói trực tiếp với AI</small>
    </div>

    <div class="chat-area" id="chat-box">
        <div class="bubble jonathan">
            <span class="label">Mr. Jonathan</span>
            Chào Thu, nhấn nút Micro bên dưới để bắt đầu buổi họp khẩn cấp.
        </div>
    </div>

    <div class="controls">
        <div id="status-text" style="margin-bottom:10px; font-weight:bold; color: var(--primary);">Sẵn sàng?</div>
        <div class="hint-box" id="hint-text"></div>
        <button class="btn btn-mic" id="mic-btn" onclick="toggleListening()"><i class="fa-solid fa-microphone"></i></button>
        <div style="margin-top:10px;">
            <button class="btn" style="background:#eee;" onclick="showHint()">Gợi ý đáp án</button>
            <a href="index.html" style="display:block; margin-top:10px; color:#666; text-decoration:none;">Thoát</a>
        </div>
    </div>
</div>

<script>
    const script = [
        {
            boss: "Morning, Thu. We are scheduled to cast off at 09:30 for the sea trials, but I just got a notification about an unverified alarm on the Main Engine. What’s the status?",
            target: "Good morning, Mr. Jonathan. Regarding the Main Engine alarm, it was a high cooling water temperature warning during the 100 percent load test. But don't worry, it is resolved.",
            keywords: ["morning", "engine", "alarm", "temperature", "resolved"]
        },
        {
            boss: "High cooling water temp? That’s critical! Did you find the root cause? Has it been re-tested?",
            target: "It was just a faulty sensor giving false readings. We have already replaced the sensor and the Class Surveyor has signed off on the report.",
            keywords: ["faulty", "sensor", "replaced", "surveyor", "signed off"]
        },
        {
            boss: "Okay. What about the Steering Gear? I heard there was a hydraulic oil leakage last week.",
            target: "We replaced the O-ring seals and performed the steering response test yesterday. There is zero delay now.",
            keywords: ["o-ring", "seals", "steering", "test", "zero delay"]
        }
    ];

    let currentStep = 0;
    const chatBox = document.getElementById('chat-box');
    const micBtn = document.getElementById('mic-btn');
    const statusText = document.getElementById('status-text');
    const hintText = document.getElementById('hint-text');

    // Khởi tạo Speech Recognition
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new Recognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    function speak(text, callback) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        msg.rate = 0.9;
        msg.onend = callback;
        window.speechSynthesis.speak(msg);
    }

    function addBubble(role, text) {
        const div = document.createElement('div');
        div.className = `bubble ${role}`;
        div.innerHTML = `<span class="label">${role === 'jonathan' ? 'Mr. Jonathan' : 'Ms. Thu (Bạn)'}</span>${text}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function startStep() {
        if (currentStep >= script.length) {
            statusText.innerText = "Hoàn thành xuất sắc!";
            addBubble('jonathan', "Excellent work today, Thu. See you on the bridge!");
            speak("Excellent work today, Thu. See you on the bridge!");
            return;
        }

        const step = script[currentStep];
        statusText.innerText = "Mr. Jonathan đang nói...";
        addBubble('jonathan', step.boss);
        speak(step.boss, () => {
            statusText.innerText = "Đến lượt bạn nói!";
            hintText.innerText = "Gợi ý: Trả lời về tình trạng máy chính/sensor...";
        });
    }

    function toggleListening() {
        if (currentStep >= script.length) return;
        recognition.start();
        micBtn.classList.add('listening');
        statusText.innerText = "Đang nghe...";
    }

    recognition.onresult = (event) => {
        micBtn.classList.remove('listening');
        const transcript = event.results[0][0].transcript;
        addBubble('thu', transcript);
        evaluateSpeech(transcript);
    };

    function evaluateSpeech(text) {
        const step = script[currentStep];
        const textLower = text.toLowerCase();
        
        // Kiểm tra từ khóa
        const matchedKeywords = step.keywords.filter(k => textLower.includes(k));
        const score = (matchedKeywords.length / step.keywords.length) * 100;

        if (score >= 50) {
            statusText.innerHTML = `<span style="color:green;">Chính xác! (${Math.round(score)}%)</span>`;
            currentStep++;
            setTimeout(startStep, 1500);
        } else {
            statusText.innerHTML = `<span style="color:red;">Chưa khớp lắm. Hãy thử lại!</span>`;
            hintText.innerText = "Bạn cần nói rõ các từ: " + step.keywords.join(", ");
        }
    }

    function showHint() {
        if (currentStep < script.length) {
            alert("Bạn nên nói: " + script[currentStep].target);
        }
    }

    // Khởi chạy bước đầu tiên
    setTimeout(startStep, 1000);
</script>
</body>
</html>
