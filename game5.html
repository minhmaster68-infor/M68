<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Roleplay Challenge - Lesson 5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0A2540; --thu: #10b981; --jonathan: #e74c3c; --bg: #f0f4f8; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        #game-container { width: 100%; max-width: 600px; background: white; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; }
        
        /* Video thu nhỏ trong game */
        .game-video { width: 100%; height: 200px; border: none; background: #000; }

        .chat-area { flex: 1; padding: 20px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; min-height: 300px; }
        .bubble { margin-bottom: 20px; max-width: 85%; position: relative; }
        .bubble.jonathan { align-self: flex-start; }
        .bubble.thu { align-self: flex-end; margin-left: auto; }
        .label { font-size: 0.7rem; font-weight: bold; margin-bottom: 4px; display: block; }
        .jonathan .label { color: var(--jonathan); }
        .thu .label { color: var(--thu); text-align: right; }
        .content { padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; }
        .jonathan .content { background: #fee2e2; color: #333; border-bottom-left-radius: 2px; }
        .thu .content { background: var(--thu); color: white; border-bottom-right-radius: 2px; }

        .controls { padding: 20px; border-top: 1px solid #eee; text-align: center; background: white; }
        .btn-mic { background: var(--jonathan); color: white; width: 65px; height: 65px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.5rem; transition: 0.3s; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); }
        .btn-mic:disabled { background: #ccc; cursor: not-allowed; }
        .btn-mic.listening { background: #2ecc71; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .status-msg { margin-top: 10px; font-size: 0.9rem; font-weight: 600; color: var(--primary); min-height: 1.2rem; }
        .btn-start { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <h3 style="margin:0;">Technical Meeting Roleplay</h3>
    </div>

    <!-- VIDEO MINH HỌA -->
    <iframe class="game-video" src="https://www.youtube.com/embed/4pmx65ULroY" title="Video context" allowfullscreen></iframe>

    <div class="chat-area" id="chat-box">
        <div style="text-align:center; color:#999; margin-top:50px;" id="welcome-screen">
            <p>Nhấn nút dưới đây để bắt đầu đối thoại với Mr. Jonathan</p>
            <button class="btn-start" onclick="startMeeting()">Bắt đầu buổi họp</button>
        </div>
    </div>

    <div class="controls" id="game-controls" style="display: none;">
        <div class="status-msg" id="status-text">Đang đợi...</div>
        <div style="margin: 15px 0;">
            <button class="btn-mic" id="mic-btn" onclick="toggleListening()">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>
        <div style="font-size: 0.8rem; color: #666;" id="hint-area"></div>
        <div style="margin-top:15px;"><a href="index.html" style="color: #666; text-decoration:none; font-size:0.8rem;">Thoát</a></div>
    </div>
</div>

<script>
    const script = [
        {
            boss: "Morning, Thu. We are scheduled to cast off at 09:30 for the sea trials, but I just got a notification about an unverified alarm on the Main Engine. What’s the status?",
            keywords: ["morning", "engine", "alarm", "temperature", "resolved"],
            hint: "Gợi ý: Nói về việc báo động nhiệt độ nước làm mát đã được xử lý."
        },
        {
            boss: "High cooling water temp? That’s critical! Did you find the root cause? Has it been re-tested?",
            keywords: ["faulty", "sensor", "replaced", "surveyor", "signed off"],
            hint: "Gợi ý: Giải thích do cảm biến lỗi (faulty sensor) và đã thay thế."
        }
    ];

    let currentStep = 0;
    const chatBox = document.getElementById('chat-box');
    const statusText = document.getElementById('status-text');
    const hintArea = document.getElementById('hint-area');
    const micBtn = document.getElementById('mic-btn');

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (Recognition) {
        recognition = new Recognition();
        recognition.lang = 'en-US';
        recognition.onresult = (e) => handleReply(e.results[0][0].transcript);
        recognition.onend = () => micBtn.classList.remove('listening');
    }

    function speak(txt, callback) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'en-US';
        u.rate = 0.9;
        u.onend = callback;
        window.speechSynthesis.speak(u);
    }

    function startMeeting() {
        document.getElementById('welcome-screen').remove();
        document.getElementById('game-controls').style.display = 'block';
        playStep();
    }

    function playStep() {
        if (currentStep >= script.length) {
            statusText.innerText = "Buổi họp kết thúc thành công!";
            return;
        }
        const step = script[currentStep];
        micBtn.disabled = true;
        statusText.innerText = "Mr. Jonathan đang nói...";
        addBubble('jonathan', step.boss);
        speak(step.boss, () => {
            micBtn.disabled = false;
            statusText.innerText = "Mời bạn trả lời...";
            hintArea.innerText = step.hint;
        });
    }

    function toggleListening() {
        recognition.start();
        micBtn.classList.add('listening');
        statusText.innerText = "Đang nghe...";
    }

    function handleReply(text) {
        addBubble('thu', text);
        const step = script[currentStep];
        const match = step.keywords.filter(w => text.toLowerCase().includes(w)).length;
        
        if (match >= 2) {
            statusText.innerHTML = "<span style='color:green;'>Chính xác!</span>";
            currentStep++;
            setTimeout(playStep, 2000);
        } else {
            statusText.innerHTML = "<span style='color:red;'>Hãy thử nói rõ hơn các từ khóa kỹ thuật.</span>";
        }
    }

    function addBubble(role, text) {
        const div = document.createElement('div');
        div.className = `bubble ${role}`;
        div.innerHTML = `<span class="label">${role === 'jonathan' ? 'Mr. Jonathan' : 'Bạn'}</span><div class="content">${text}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
