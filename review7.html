<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Word Sorter - Bài 7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00D4B2; --danger: #ff4757; --warning: #f1c40f; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; overflow: hidden; touch-action: manipulation; }
        
        /* Container chính co giãn theo màn hình */
        #game-container {
            position: relative; width: 100vw; height: 100vh;
            background: url('game7_bg.png') no-repeat center center;
            background-size: cover; display: none; flex-direction: column; align-items: center;
        }

        /* Màn hình Start */
        #start-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;
        }
        .video-box { width: 100%; max-width: 500px; aspect-ratio: 16/9; border: 3px solid var(--primary); border-radius: 15px; overflow: hidden; }
        .btn-start { margin-top: 20px; padding: 15px 40px; font-size: 1.2rem; background: var(--primary); border: none; color: #000; font-weight: bold; border-radius: 50px; cursor: pointer; }

        /* Bảng hiển thị thông tin lắng nghe (Phản hồi lỗi) */
        #feedback-panel {
            position: absolute; top: 10px; width: 90%; max-width: 500px;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 12px;
            border-bottom: 3px solid var(--primary); text-align: center; z-index: 10;
        }
        #transcript { color: var(--warning); font-style: italic; font-size: 0.9rem; margin: 5px 0; }
        #error-msg { color: var(--danger); font-weight: bold; font-size: 0.9rem; min-height: 1.2rem; }

        /* Bảng gỗ chứa các ô chữ - Tối ưu cho Mobile */
        #wood-board {
            position: absolute; top: 55%; transform: translateY(-50%);
            width: 90%; max-width: 600px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            padding: 15px; background: rgba(101, 67, 33, 0.4); border-radius: 15px;
        }

        .word-slot {
            aspect-ratio: 2/1; background: rgba(255,255,255,0.15);
            border: 2px dashed rgba(255,255,255,0.5); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: bold; text-align: center; text-transform: uppercase;
        }
        .word-active { background: var(--warning) !important; color: #000; border: 2px solid #000; box-shadow: 0 0 15px var(--warning); }

        /* Trạng thái Microphone */
        #mic-indicator {
            position: absolute; bottom: 20px; padding: 10px 25px;
            border-radius: 50px; background: #333; display: flex; align-items: center; gap: 10px;
        }
        .pulse { animation: pulse-red 1.5s infinite; background: var(--danger) !important; }
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        @media (max-width: 480px) {
            #wood-board { grid-template-columns: repeat(2, 1fr); top: 50%; }
            .word-slot { font-size: 0.7rem; }
            #instruction-text { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<!-- MÀN HÌNH BẮT ĐẦU -->
<div id="start-screen">
    <h2 style="color:var(--primary)">VOICE WORD SORTER</h2>
    <p>Nghe và đọc đúng từ + vị trí để xếp vào bảng gỗ</p>
    <div class="video-box">
        <iframe width="100%" height="100%" src="https://www.youtube.com/embed/b3X3Cc3By6k" frameborder="0" allowfullscreen></iframe>
    </div>
    <button class="btn-start" onclick="startGame()">BẮT ĐẦU NGAY</button>
</div>

<!-- GIAO DIỆN GAME -->
<div id="game-container">
    <div id="feedback-panel">
        <div id="instruction-text">Đọc: <b>[Từ vựng] + Position + [Số]</b></div>
        <div id="transcript">Đang chờ bạn nói...</div>
        <div id="error-msg"></div>
    </div>

    <div id="wood-board">
        <!-- Các ô chữ tự động sinh ra ở đây -->
    </div>

    <div id="mic-indicator">
        <i class="fa-solid fa-microphone"></i>
        <span id="mic-text">Chạm để bật Mic</span>
    </div>
</div>

<script>
    const targetSentence = ["THE", "NAVAL ARCHITECT", "WORKS", "IN", "THE", "DESIGN", "OFFICE"];
    const container = document.getElementById('game-container');
    const board = document.getElementById('wood-board');
    const transcriptEl = document.getElementById('transcript');
    const errorEl = document.getElementById('error-msg');
    const micIndicator = document.getElementById('mic-indicator');

    let recognition;
    let isListening = false;

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        container.style.display = 'flex';
        initBoard();
        setupSpeech();
    }

    function initBoard() {
        board.innerHTML = '';
        targetSentence.forEach((_, i) => {
            const slot = document.createElement('div');
            slot.className = 'word-slot';
            slot.id = `slot-${i + 1}`;
            slot.innerHTML = `Slot ${i + 1}`;
            board.appendChild(slot);
        });
    }

    function setupSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) {
            alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome!");
            return;
        }
        recognition = new Speech();
        recognition.lang = 'en-US';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isListening = true;
            micIndicator.classList.add('pulse');
            document.getElementById('mic-text').innerText = "Đang lắng nghe...";
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript.toUpperCase();
                } else {
                    interimTranscript += event.results[i][0].transcript.toUpperCase();
                }
            }

            transcriptEl.innerText = "Tôi nghe thấy: " + (finalTranscript || interimTranscript);
            
            if (finalTranscript) {
                processCommand(finalTranscript);
            }
        };

        recognition.onerror = () => {
            stopMic();
        };

        // Bật/Tắt Mic khi chạm vào indicator
        micIndicator.onclick = () => {
            if (!isListening) recognition.start();
            else stopMic();
        };
    }

    function stopMic() {
        recognition.stop();
        isListening = false;
        micIndicator.classList.remove('pulse');
        document.getElementById('mic-text').innerText = "Chạm để bật Mic";
    }

    function processCommand(text) {
        errorEl.innerText = ""; // Xóa lỗi cũ
        let matchedAny = false;

        targetSentence.forEach((word, index) => {
            if (text.includes(word)) {
                matchedAny = true;
                const posNum = index + 1;
                
                // Kiểm tra xem người dùng có đọc đúng số vị trí không
                // Ví dụ: "Naval Architect position 2"
                if (text.includes("POSITION " + posNum) || text.includes("POSITION" + posNum) || text.includes("NUMBER " + posNum)) {
                    const slot = document.getElementById(`slot-${posNum}`);
                    slot.innerText = word;
                    slot.classList.add('word-active');
                    errorEl.style.color = "var(--primary)";
                    errorEl.innerText = `Chính xác: ${word} vào ô ${posNum}!`;
                    checkWin();
                } else if (text.includes("POSITION")) {
                    // Nếu nghe thấy từ đúng nhưng vị trí sai
                    errorEl.style.color = "var(--danger)";
                    errorEl.innerText = `Sai vị trí! Thử lại: "${word} position ${posNum}"`;
                }
            }
        });

        if (!matchedAny) {
            errorEl.style.color = "var(--warning)";
            errorEl.innerText = "Không khớp từ vựng nào. Hãy phát âm rõ hơn!";
        }
    }

    function checkWin() {
        const filled = document.querySelectorAll('.word-active').length;
        if (filled === targetSentence.length) {
            errorEl.innerText = "TUYỆT VỜI! BẠN ĐÃ HOÀN THÀNH CÂU!";
            setTimeout(() => {
                if(confirm("Bạn muốn chơi lại không?")) location.reload();
            }, 1500);
        }
    }
</script>
</body>
</html>
