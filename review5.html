<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review 5: Emergency Technical Meeting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0A2540; --accent: #e74c3c; --bg: #F8FAFC; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        
        /* CSS cho Video minh họa */
        .video-wrapper { 
            position: relative; 
            padding-bottom: 56.25%; /* Tỉ lệ 16:9 */
            height: 0; 
            overflow: hidden; 
            border-radius: 12px; 
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .video-wrapper iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; 
        }

        h2 { border-left: 5px solid var(--accent); padding-left: 15px; color: var(--primary); margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #E2E8F0; }
        .btn-speak { background: none; border: none; color: #0073E6; cursor: pointer; }
        .back-nav { margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="back-nav"><a href="index.html" style="text-decoration:none; color:var(--primary); font-weight:bold;">← Quay lại trang chủ</a></div>
    <h1>Bài 5: Emergency Technical Meeting</h1>

    <!-- VIDEO MINH HỌA -->
    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/4pmx65ULroY" title="Emergency Technical Meeting" allowfullscreen></iframe>
    </div>

    <h2>I. Từ vựng trọng tâm (Key Vocabulary)</h2>
    <table>
        <thead>
            <tr>
                <th>Thuật ngữ</th>
                <th>Ý nghĩa</th>
            </tr>
        </thead>
        <tbody id="vocab-body"></tbody>
    </table>

    <h2>II. Tóm tắt tình huống</h2>
    <p>Bạn sẽ đối mặt với các câu hỏi hóc búa về <strong>Main Engine Alarm</strong>, <strong>Steering Gear Leakage</strong> và <strong>Sea Trials Schedule</strong>. Hãy học kỹ từ vựng trước khi vào phần Roleplay.</p>
</div>

<script>
    const data = [
        { t: "Sea trials", m: "Thử nghiệm đường biển" },
        { t: "Cast off", m: "Rời bến / Tháo dây buộc tàu" },
        { t: "Main Engine alarm", m: "Báo động máy chính" },
        { t: "Faulty sensor", m: "Cảm biến bị lỗi" },
        { t: "Class Surveyor", m: "Đăng kiểm viên" },
        { t: "Hydraulic oil leakage", m: "Rò rỉ dầu thủy lực" },
        { t: "Blackout test", m: "Thử nghiệm mất điện toàn tàu" },
        { t: "Protocol of Acceptance", m: "Biên bản nghiệm thu" }
    ];
    const body = document.getElementById('vocab-body');
    data.forEach(item => {
        body.innerHTML += `<tr><td><strong>${item.t}</strong> <button class="btn-speak" onclick="speak('${item.t}')"><i class="fa-solid fa-volume-high"></i></button></td><td>${item.m}</td></tr>`;
    });
    function speak(txt) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(txt);
        m.lang = 'en-US';
        window.speechSynthesis.speak(m);
    }
</script>
</body>
</html>
