<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2: Tiếp đón & Cây cảnh - Review</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0A2540; --accent: #00D4B2; --bg: #F8FAFC; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1E293B; }
        .container { max-width: 900px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .back-nav { margin-bottom: 20px; }
        .back-nav a { text-decoration: none; color: var(--primary); font-weight: 600; }
        
        h1 { color: var(--primary); text-align: center; margin-bottom: 30px; }
        
        /* Video Section */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        h2 { border-left: 5px solid var(--accent); padding-left: 15px; color: var(--primary); margin-top: 40px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #E2E8F0; }
        
        .btn-speak { background: none; border: none; color: #0073E6; cursor: pointer; font-size: 1.1rem; }
        .example { font-style: italic; color: #64748B; font-size: 0.9rem; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="back-nav"><a href="index.html">← Quay lại trang chủ</a></div>
    
    <h1>Bài 2: Nghệ thuật Cây cảnh & Giao tiếp</h1>

    <!-- VIDEO MINH HỌA -->
    <div class="video-container">
        <!-- Thay ID video thực tế vào đây -->
        <iframe src="https://youtu.be/QQFcnDF4HfU" title="Shipbuilding Small Talk" allowfullscreen></iframe>
    </div>

    <h2>I. Từ vựng trọng tâm (Key Vocabulary)</h2>
    <table>
        <thead>
            <tr>
                <th>Từ vựng</th>
                <th>Ý nghĩa</th>
                <th>Ví dụ ứng dụng</th>
            </tr>
        </thead>
        <tbody id="vocab-body">
            <!-- Data loaded by JS -->
        </tbody>
    </table>

    <h2>II. Cụm từ xã giao (Casual Conversation)</h2>
    <div id="phrases-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
        <!-- Phrases loaded by JS -->
    </div>
</div>

<script>
    const vocabData = [
        { term: "Small talk", ipa: "/smɔːl tɔːk/", mean: "Trò chuyện xã giao / đời thường", ex: "The meeting started with some small talk about hobbies." },
        { term: "Potted tree", ipa: "/ˈpɒtɪd triː/", mean: "Cây trồng trong chậu", ex: "You have some beautiful potted trees in the yard." },
        { term: "Ornamental trees", ipa: "/ˌɔːrnəˈmentl triːz/", mean: "Cây cảnh trang trí", ex: "In Vietnam, we love cultivating ornamental trees." },
        { term: "Specialized fertilization", ipa: "/ˈfɜːrtəlaɪzeɪʃn/", mean: "Bón phân đặc biệt / chuyên dụng", ex: "We use a specialized fertilization routine for kumquats." },
        { term: "Foliage stripping", ipa: "/ˈfoʊliɪdʒ ˈstrɪpɪŋ/", mean: "Kỹ thuật tuốt lá", ex: "Timing the foliage stripping is key to making them bloom." },
        { term: "Precise engineering", ipa: "/prɪˈsaɪs ˌendʒɪˈnɪərɪŋ/", mean: "Kỹ thuật chính xác", ex: "Precise engineering in the shipyard, precise chemistry in the garden." },
        { term: "Enriching the soil", ipa: "/ɪnˈrɪtʃɪŋ/", mean: "Bổ sung dưỡng chất cho đất", ex: "Enriching the soil with potassium before the fruiting season." }
    ];

    const phrases = [
        { q: "Outside of building ships", a: "Ngoài việc đóng tàu (thời gian rảnh)" },
        { q: "Timing is key", a: "Thời điểm là yếu tố then chốt" },
        { q: "Enrich the soil", a: "Làm giàu/bổ sung dưỡng chất cho đất" },
        { q: "Fruit-bearing", a: "Có quả / Kết quả" }
    ];

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
    }

    const table = document.getElementById('vocab-body');
    vocabData.forEach(v => {
        table.innerHTML += `
            <tr>
                <td><strong>${v.term}</strong> <button class="btn-speak" onclick="speak('${v.term}')"><i class="fa-solid fa-volume-high"></i></button><br><small>${v.ipa}</small></td>
                <td>${v.mean}</td>
                <td><span class="example">${v.ex}</span></td>
            </tr>
        `;
    });

    const phraseBox = document.getElementById('phrases-container');
    phrases.forEach(p => {
        phraseBox.innerHTML += `
            <div style="background:#f1f5f9; padding:15px; border-radius:10px;">
                <div style="font-weight:700; color:var(--primary)">${p.q} <button class="btn-speak" onclick="speak('${p.q}')"><i class="fa-solid fa-play"></i></button></div>
                <div style="color:var(--accent); font-size:0.9rem;">${p.a}</div>
            </div>
        `;
    });
</script>
</body>
</html>
